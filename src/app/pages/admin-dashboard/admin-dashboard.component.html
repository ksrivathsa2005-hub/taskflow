<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-slate-900">Platform Overview</h1>
        <p class="text-slate-500 mt-1">Real-time analytics and management tools.</p>
    </div>

    <!-- Quick Action Buttons -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <button (click)="navigateToUserManagement()" class="px-6 py-4 bg-blue-50 border border-blue-200 rounded-xl hover:bg-blue-100 transition-colors text-left">
            <p class="font-bold text-blue-900">Manage Users</p>
            <p class="text-sm text-blue-700 mt-1">View and manage all users</p>
        </button>
        <button (click)="navigateToTaskReview()" class="px-6 py-4 bg-indigo-50 border border-indigo-200 rounded-xl hover:bg-indigo-100 transition-colors text-left">
            <p class="font-bold text-indigo-900">Review Tasks</p>
            <p class="text-sm text-indigo-700 mt-1">Check prevoius activity</p>
        </button>
        <button (click)="navigateToDisputes()" class="px-6 py-4 bg-red-50 border border-red-200 rounded-xl hover:bg-red-100 transition-colors text-left">
            <p class="font-bold text-red-900">Manage Disputes</p>
            <p class="text-sm text-red-700 mt-1">Handle platform disputes</p>
        </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <div *ngFor="let stat of stats$ | async"
            class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center space-x-4">
            <div class="p-3 rounded-xl {{stat.bg}} {{stat.color}}">
                <lucide-icon [img]="stat.icon" class="w-6 h-6"></lucide-icon>
            </div>
            <div>
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">{{stat.label}}</p>
                <p class="text-2xl font-black text-slate-900">{{stat.value}}</p>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
        <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/50">
            <h3 class="font-bold text-slate-800">Recent Platform Activity</h3>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead>
                    <tr class="text-[10px] font-bold text-slate-400 uppercase tracking-widest bg-white">
                        <th class="px-6 py-4">Task ID</th>
                        <th class="px-6 py-4">Title</th>
                        <th class="px-6 py-4">Status</th>
                        <th className="px-6 py-4">Value</th>
                        <th class="px-6 py-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <tr *ngFor="let task of tasks$ | async" class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4 text-xs font-medium text-slate-400">#{{task.id}}</td>
                        <td class="px-6 py-4 text-sm font-bold text-slate-800">{{task.title}}</td>
                        <td class="px-6 py-4">
                            <span
                                class="text-[10px] font-black px-2 py-0.5 rounded-md border border-indigo-200 text-indigo-700 bg-indigo-50">
                                {{task.status}}
                            </span>
                        </td>
                        <td class="px-6 py-4 text-sm text-slate-600">₹{{task.budgetMax}}</td>
                        <td class="px-6 py-4 text-right">
                            <button (click)="navigateToTaskReview()" class="text-indigo-600 hover:text-indigo-800 font-bold text-sm">Review</button>
                        </td>
                    </tr>
                    <tr *ngIf="(tasks$ | async)?.length === 0">
                        <td colspan="5" class="px-6 py-10 text-center text-slate-400 italic">No activity logged in the
                            system.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
